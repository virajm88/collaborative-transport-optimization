[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collaborative-transport-optimization"
version = "0.1.0"
description = "Transport MILP, cooperative cost allocation, and dual-cut Benders decomposition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.scripts]
collab-transport = "collab_transport.cli:main"

[tool.setuptools.packages.find]
include = ["collab_transport*"]

